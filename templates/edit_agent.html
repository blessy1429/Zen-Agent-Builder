{% extends "base.html" %}

{% block content %}

<div class="card">

    <h2>Edit Agent</h2>

    <form method="post" action="/update-agent/{{ agent.id }}">

        <input
            type="text"
            name="agent_name"
            value="{{ agent.agent_name }}"
            required
        >

        <textarea
            name="description"
        >{{ agent.description }}</textarea>

        <select name="status">
            <option value="Active">Active</option>
            <option value="Disabled">Disabled</option>
        </select>

        <button class="primary-btn">
            Update Agent
        </button>

    </form>

</div>

{% endblock %}
