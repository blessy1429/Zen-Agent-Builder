{% extends "base.html" %}

{% block content %}

<h2>Edit User</h2>

<form method="post" action="/update-user/{{ user.id }}">

    <input
        type="text"
        name="username"
        value="{{ user.username }}"
        required
    >

    <br><br>

    <input
        type="email"
        name="email"
        value="{{ user.email }}"
        required
    >

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="Leave blank to keep existing password"
    >

    <br><br>

    <select
        name="role_id"
        required
    >

        {% for role in roles %}

        <option
            value="{{ role.id }}"
            {% if role.id == user.role_id %}
            selected
            {% endif %}
        >

            {{ role.name }}

        </option>

        {% endfor %}

    </select>

    <br><br>

    <button type="submit">
        Update User
    </button>

</form>

{% endblock %}
