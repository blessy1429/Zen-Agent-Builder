{% extends "base.html" %}

{% block content %}

<div class="page-card">

    <h2 class="page-title">
        Modules
    </h2>

    <table class="modules-table">

        <thead>
            <tr>
                <th>ID</th>
                <th>Module Name</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

            {% for module in modules %}

            <tr>

                <td>{{ module.id }}</td>

                <td>{{ module.name }}</td>

                <td>{{ module.status }}</td>

                <td>

                    <a
                        href="/edit-module/{{ module.id }}"
                        class="action-link"
                    >
                        Edit
                    </a>

                    <a
                        href="/toggle-module/{{ module.id }}"
                        class="action-link"
                    >
                        Toggle
                    </a>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
