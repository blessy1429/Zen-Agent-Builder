<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Agent Builder - Register</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        .container{
            width:450px;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 15px 35px rgba(0,0,0,0.2);
        }

        .logo{
            text-align:center;
            font-size:60px;
            margin-bottom:10px;
        }

        h2{
            text-align:center;
            color:#333;
            margin-bottom:5px;
        }

        .subtitle{
            text-align:center;
            color:gray;
            margin-bottom:25px;
            font-size:14px;
        }

        label{
            display:block;
            font-weight:600;
            margin-bottom:8px;
            color:#444;
        }

        input,
        select{
            width:100%;
            padding:12px;
            margin-bottom:18px;
            border:1px solid #ddd;
            border-radius:8px;
            font-size:14px;
            transition:0.3s;
        }

        input:focus,
        select:focus{
            outline:none;
            border-color:#667eea;
            box-shadow:0 0 8px rgba(102,126,234,0.4);
        }

        button{
            width:100%;
            padding:12px;
            background:#667eea;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#5563d8;
            transform:translateY(-2px);
        }

        .login-link{
            text-align:center;
            margin-top:20px;
        }

        .login-link a{
            color:#667eea;
            text-decoration:none;
            font-weight:bold;
        }

        .login-link a:hover{
            text-decoration:underline;
        }

        .footer{
            margin-top:20px;
            text-align:center;
            color:#999;
            font-size:12px;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="logo">
            
        </div>

        <h2>Create Account</h2>

        <p class="subtitle">
            Register to access the User Management System
        </p>

        <form method="post" action="/register-form">

            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Enter Username"
                required
            >

            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="Enter Email Address"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            <label>Role</label>

            <select name="role_id" required>

                {% for role in roles %}

                <option value="{{ role.id }}">
                    {{ role.name }}
                </option>

                {% endfor %}

            </select>

            <button type="submit">
                Register
            </button>

        </form>

        <div class="login-link">

            <p>
                Already have an account?
                <a href="/">
                    Login Here
                </a>
            </p>

        </div>

        <div class="footer">
            User Management System © 2026
        </div>

    </div>

</body>

</html>
