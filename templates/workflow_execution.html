{% extends "user_base.html" %}

{% block content %}

<div class="page-header">
    <h2>Execute Workflow</h2>
</div>

<div class="card">

    <h3>{{ workflow.workflow_name }}</h3>

    <form action="/run-workflow/{{ workflow.id }}"
          method="post"
          enctype="multipart/form-data">

        <div class="form-group">
            <label>Upload Input Document</label>

            <input type="file"
                   name="file"
                   class="form-control"
                   required>
        </div>

        <button type="submit"
                class="btn btn-primary">
            Run Workflow
        </button>

    </form>

</div>

{% if execution_log %}

<div class="card mt-4">

    <h3>Execution Log</h3>

    <ul>
        {% for log in execution_log %}
        <li>{{ log }}</li>
        {% endfor %}
    </ul>

</div>

{% endif %}

{% if result %}

<div class="card mt-4">

    <h3>Result</h3>

    <pre>{{ result }}</pre>

</div>

{% endif %}

{% endblock %}
